pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location /health {
      access_log off;
      return 200 'healthy';
      add_header Content-Type text/plain;
    }

    # Static assets
    location /assets/ {
      try_files $uri =404;
    }

    # SPA fallback
    location / {
      try_files $uri /index.html;
    }
  }
}